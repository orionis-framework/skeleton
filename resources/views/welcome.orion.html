<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orionis Framework</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="https://raw.githubusercontent.com/orionis-framework/framework/refs/heads/1.x/orionis/static/favicon/OrionisFrameworkFavicon.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: #edeced url('https://raw.githubusercontent.com/orionis-framework/framework/refs/heads/1.x/orionis/static/bg/galaxy.jpg') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(30, 96, 143, 0.6);
            z-index: -1;
        }
        .btn-hover:hover {
            transform: scale(1.05);
            transition: transform 0.2s ease-in-out;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen text-white relative">
    <div class="text-center p-6 max-w-2xl w-full">
        <img src="https://raw.githubusercontent.com/orionis-framework/framework/refs/heads/1.x/orionis/static/logos/OrionisFramework3.png" alt="Orionis Framework Logo" class="mx-auto w-96 mb-10 animate-fadeIn">

        <hr class="mb-10">

        <h1 class="text-4xl font-bold text-white">Orionis Framework</h1>
        <p class="text-lg text-gray-200 mt-2">⚡ Orionis Framework – Elegant, Fast, and Powerful 🚀</p>

        <div class="mt-6 flex justify-center gap-4">
            <a href="#" class="bg-[#fdc850] text-[#1e608f] px-6 py-3 rounded-lg font-semibold text-lg shadow-md hover:shadow-lg transition flex items-center gap-2 btn-hover">
                📖 Documentatión
            </a>
            <a href="https://github.com/orionis-framework/framework" target="_blank" class="bg-[#1e608f] text-white px-6 py-3 rounded-lg font-semibold text-lg shadow-md hover:shadow-lg transition flex items-center gap-2 btn-hover">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
                    <path fill-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.167 6.839 9.49.5.09.682-.217.682-.483 0-.237-.009-.866-.013-1.7-2.782.603-3.369-1.34-3.369-1.34-.455-1.157-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.004.07 1.532 1.032 1.532 1.032.892 1.528 2.341 1.087 2.91.832.09-.647.35-1.087.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.09.39-1.98 1.029-2.676-.103-.253-.446-1.27.098-2.645 0 0 .84-.269 2.75 1.021A9.58 9.58 0 0112 6.8c.852.004 1.71.114 2.511.334 1.91-1.29 2.75-1.021 2.75-1.021.544 1.375.201 2.392.098 2.645.64.696 1.028 1.586 1.028 2.676 0 3.843-2.338 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.337-.012 2.417-.012 2.744 0 .268.181.576.688.478A10.012 10.012 0 0022 12c0-5.523-4.477-10-10-10z" clip-rule="evenodd" />
                </svg>
                Github
            </a>
        </div>
    </div>

    <footer class="mt-8 text-center text-sm text-gray-200">
        Orionis Framework - Versión 1.x
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.querySelector(".animate-fadeIn").style.opacity = 1;
        });
    </script>
</body>
</html>
